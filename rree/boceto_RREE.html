<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boceto RREE UAI</title>
<style>
:root{--n:#111111;--p:#3F4247;--g:#8A8D91;--s:#BFC3C8;--l:#DADCDF;--bg:#EFEFF0;--w:#FFFFFF;--neg:#B3261E;--pos:#1B2A4A}
*{box-sizing:border-box}body{margin:0;background:#d9dadc;font:13px/1.35 "Segoe UI",Arial,sans-serif;color:var(--n)}
.pg{max-width:1280px;aspect-ratio:16/9;margin:24px auto;background:var(--bg);padding:18px 24px;display:grid;grid-template-rows:auto auto 1fr;gap:12px;overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--l);padding-bottom:8px}
.hd h1{font-size:20px;margin:0;letter-spacing:.3px}.hd small{color:var(--g)}
.nav{display:flex;gap:4px}.nav b{padding:5px 12px;font-weight:600;font-size:12px}.nav .on{background:var(--n);color:var(--w)}
.upd{color:var(--g);font-size:11px}.upd:before{content:"●";color:var(--pos);margin-right:4px;animation:pl 2s infinite}
@keyframes pl{50%{opacity:.3}}
.kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.k{padding:8px 12px;border-left:1px solid var(--l)}.k:first-child{border:0}
.k h4{margin:0;font-size:12px}.k .v{font-size:28px;font-weight:300}.k .s{font-size:11px;color:var(--p)}
.up{color:var(--pos)}.dn{color:var(--neg)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1.4fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.v2{display:flex;flex-direction:column;min-height:0}.v2 h3{font-size:12px;margin:0 0 6px;color:var(--p);text-transform:uppercase;letter-spacing:.6px}
.bars div{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:11px}.bars span{width:110px;color:var(--p)}
.bars i{height:12px;background:linear-gradient(90deg,var(--p),var(--s))}
table{width:100%;border-collapse:collapse;font-size:11px}th{text-align:left;border-bottom:1px solid var(--n);padding:4px}td{border-bottom:1px solid var(--l);padding:4px}
.pill{padding:1px 8px;border-radius:9px;font-size:10px;color:var(--w)}.pp{background:var(--pos)}.pn{background:var(--neg);animation:pl 2s infinite}.pg0{background:var(--g)}
.note{font-size:10px;color:var(--g);font-style:italic}

.sub{display:flex;gap:14px;font-size:11px;color:var(--g)}.sub b{font-weight:600}.sub .on{color:var(--n);border-bottom:2px solid var(--n)}
.tag{font-size:10px;color:var(--g);letter-spacing:.8px;text-transform:uppercase}
.idx{max-width:1280px;margin:24px auto;background:var(--w);padding:18px 24px}.idx h2{margin:0 0 8px;font-size:16px}.idx ol{columns:2;font-size:12px;margin:0}
</style></head><body>
<p class="note" style="text-align:center">Boceto de estructura · "#.###" = marcador. En Power BI cada valor es una medida DAX sobre tus matrices RREE (sin modificarlas). Ejes a ajustar a las páginas de tu informe actual.</p>
<div class="idx"><h2>Índice del informe</h2><ol id="ix"></ol></div>
<div id="app"></div>
<script>
const E=["Resumen","Inversión","Uso","Colección","Renovación","Acreditación CNA","Discontinuados"];
const P=[
["Resumen","General","Resumen Ejecutivo RREE",["Inversión anual|$#.###|▼ -0% vs año ant.|dn","Usos totales|#.###|▲ +0% YTD|up","Costo por uso|$###|▲ mejora|up","Recursos activos|##|de ## evaluados|","Bajo umbral|##|▼ revisar|dn"],["line|Uso mensual: año actual vs anterior","scatter|Costo vs uso: mapa de decisión"]],
["Inversión","General","Inversión · Visión General",["Inversión total|$#.###|▼ -0%|dn","Proveedores|##||","% en investigación|0%|▲ +0%|up","Variación de precios|+0%|▼ alza|dn","Moneda USD/CLP|$###||"],["line|Inversión anual (5 años)","bars|Inversión por proveedor"]],
["Inversión","Detalle proveedor","Inversión · Detalle por Proveedor",[],["table|Proveedor · Contrato · Moneda · Monto · Var. · Vencimiento","bars|Participación en el gasto"]],
["Inversión","Detalle recurso","Inversión · Detalle por Recurso",[],["table|Recurso · Proveedor · Costo · Usos · Costo/uso · Var.","bars|Top 10 costo por uso"]],
["Uso","General","Uso · Visión General",["Usos totales|#.###|▲ +0%|up","Búsquedas|#.###|▲ +0%|up","Descargas|#.###|▼ -0%|dn","Usuarios únicos|#.###||","Uso por estudiante|##||"],["line|Uso mensual por métrica","bars|Top recursos por uso"]],
["Uso","Detalle recurso","Uso · Detalle por Recurso y Mes",[],["matrix|Recurso × Mes (usos)","line|Estacionalidad del recurso seleccionado"]],
["Uso","Detalle área","Uso · Detalle por Área / Facultad",[],["bars|Uso por área","table|Área · Recurso · Usos · Var. · Uso por usuario"]],
["Colección","General","Colección · Visión General",["Títulos disponibles|#.###||","Revistas|#.###||","E-books|#.###||","Bases de datos|##||","Acceso perpetuo|0%||"],["bars|Títulos por tipo de recurso","bars|Títulos por disciplina"]],
["Colección","Detalle","Colección · Detalle por Tipo y Disciplina",[],["matrix|Tipo × Disciplina (títulos)","table|Recurso · Tipo · Títulos · Cobertura · Acceso"]],
["Renovación","General","Renovación · Visión General",["Por renovar (12 m)|##||","Monto en decisión|$#.###||","Mantener|##||up","Renegociar|##||dn","Observar|##||"],["scatter|Matriz costo vs uso (cuadrantes)","bars|Calendario de vencimientos"]],
["Renovación","Detalle","Renovación · Recursos Bajo Umbral",[],["table|Recurso · Vence · Costo · CPU · Umbral · Tendencia 3 años · Recomendación","line|Tendencia de uso del recurso seleccionado"]],
["Acreditación CNA","General","Acreditación CNA · Visión General",["C8 Gestión de recursos|▲|inversión sostenida|up","C13 Gestión investigación|▲|bases activas|up","C14 Resultados investigación|▼|descargas|dn","Años evidenciados|3||","Evidencias exportables|##||"],["table|Criterio · Indicador · 20XX · 20XX · 20XX · Semáforo","bars|Tendencia consolidada 3 años"]],
["Acreditación CNA","C8","CNA · Criterio 8 · Gestión de Recursos",["Inversión 3 años|$#.###|▲ sostenida|up","Costo por uso|$###|▲ eficiencia|up","Inversión por estudiante|$###||"],["line|Inversión, usos y costo por uso (3 años)","table|Año · Inversión · Usos · CPU · Por estudiante"]],
["Acreditación CNA","C13","CNA · Criterio 13 · Política y Gestión de Investigación",["Bases de investigación|##||","% inversión a investigación|0%|▲ +0%|up","Acuerdos/convenios|##||"],["bars|Inversión en recursos de investigación por año","table|Recurso · Disciplina · Usos · Semáforo"]],
["Acreditación CNA","C14","CNA · Criterio 14 · Resultados de Investigación",["Descargas de artículos|#.###|▲ +0%|up","Uso por académico|##||","Disciplinas cubiertas|##||"],["line|Descargas de artículos (3 años)","table|Disciplina · Descargas · Var. · Semáforo"]],
["Discontinuados","General","Discontinuados · Lo que Perdimos",["Recursos cancelados|##|desde 20XX|","Ahorro anual|$#.###|▲ liberado|up","Uso perdido|#.###|▼ consultas/año|dn","Rechazos de acceso|###|▼ demanda sin cubrir|dn","Candidatos a reactivar|#||"],["bars|Uso del último año suscrito","table|Recurso · Último año · Costo · Uso · CPU · Lectura"]],
["Discontinuados","Detalle","Discontinuados · Historia por Recurso",[],["line|Uso histórico hasta la cancelación","table|Recurso · Año · Costo · Usos · Rechazos post-cancelación"]]
];
const L='<svg viewBox="0 0 600 200" width="100%"><line x1="0" y1="190" x2="600" y2="190" stroke="#DADCDF"/><polyline fill="none" stroke="#BFC3C8" stroke-width="3" points="20,140 90,120 160,130 230,100 300,110 370,90 440,100 510,80 580,85"/><polyline fill="none" stroke="#111" stroke-width="3" points="20,130 90,105 160,110 230,80 300,85 370,65"/><g fill="#111"><circle cx="20" cy="130" r="4"/><circle cx="230" cy="80" r="4"/><circle cx="370" cy="65" r="4"/></g></svg>';
const S='<svg viewBox="0 0 400 200" width="100%"><line x1="200" y1="0" x2="200" y2="200" stroke="#DADCDF"/><line x1="0" y1="100" x2="400" y2="100" stroke="#DADCDF"/><g font-size="10" fill="#8A8D91"><text x="208" y="12">Mantener</text><text x="208" y="195" fill="#B3261E">Renegociar</text><text x="6" y="12">Eficiente</text><text x="6" y="195">Difundir</text></g><g fill="#1B2A4A"><circle cx="260" cy="45" r="7"/><circle cx="90" cy="55" r="5"/></g><g fill="#B3261E"><circle cx="320" cy="160" r="8"/></g><circle cx="70" cy="150" r="5" fill="#8A8D91"/></svg>';
const B=()=>'<div class="bars">'+[88,70,55,40,26].map((w,i)=>`<div><span>Elemento ${i+1}</span><i style="width:${w}%"></i></div>`).join('')+'</div>';
const T=h=>{const c=h.split(' · ');return '<table><tr>'+c.map(x=>`<th>${x}</th>`).join('')+'</tr>'+[1,2,3].map(r=>'<tr>'+c.map((x,i)=>`<td>${i?'#':'Fila '+r}</td>`).join('')+'</tr>').join('')+'</table>'};
const M=()=>'<table><tr><th></th>'+['Ene','Feb','Mar','Abr','May','…','Total'].map(x=>`<th>${x}</th>`).join('')+'</tr>'+[1,2,3,4].map(r=>`<tr><td>Fila ${r}</td>`+'<td>#</td>'.repeat(7)+'</tr>').join('')+'</table>';
const V=b=>{const[t,h]=b.split('|');return `<div class="v2"><h3>${h}</h3>${t=='line'?L:t=='scatter'?S:t=='bars'?B():t=='matrix'?M():T(h)}</div>`};
let ix='',out='';
P.forEach((p,n)=>{const[e,s,ti,k,b]=p;const subs=P.filter(q=>q[0]==e).map(q=>q[1]);
ix+=`<li>${ti}</li>`;
out+=`<section class="pg"><div class="hd"><div><span class="tag">${e} · ${s} · pág. ${n+1}</span><h1>${ti}</h1>
${subs.length>1?'<div class="sub">'+subs.map(x=>`<b class="${x==s?'on':''}">${x}</b>`).join('')+'</div>':''}</div>
<div class="nav">${E.map(x=>`<b class="${x==e?'on':''}">${x}</b>`).join('')}</div><span class="upd">Datos al dd-mm-aaaa</span></div>
${k.length?'<div class="kpi">'+k.map(x=>{const[a,v,su,c]=x.split('|');return `<div class="k"><h4>${a}</h4><div class="v">${v}</div><div class="s ${c||''}">${su}</div></div>`}).join('')+'</div>':'<div class="note">Segmentadores: Año · Proveedor · Tipo · Área · Recurso — detalle exportable a Excel</div>'}
<div class="grid g2">${b.map(V).join('')}</div></section>`});
document.getElementById('ix').innerHTML=ix;document.getElementById('app').innerHTML=out;
</script></body></html>
