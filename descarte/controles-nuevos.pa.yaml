- barCamara_1:
    Control: BarcodeReader
    Properties:
      Height: =52
      OnScan: |-
        =Set(varEntrada, Trim(First(Self.Barcodes).Value));
        Select(btnProcesarEscaneo)
      Text: ="CÁMARA"
      Width: =66
      X: =378
      Y: =322
- btnProcesarEscaneo:
    Control: Classic/Button@2.2.0
    Properties:
      BorderThickness: =0
      Color: =RGBA(0, 0, 0, 0)
      Fill: =RGBA(0, 0, 0, 0)
      Height: =1
      HoverFill: =RGBA(0, 0, 0, 0)
      OnSelect: |-
        =With(
            {cod: varEntrada},
            If(
                !IsBlank(cod),
                Set(varCodigo, cod);
                Set(varBuscando, true);
                Set(varRes, IfError(Text('Copiade:BuscarLibroFOLIO'.Run(cod).datos), Blank()));
                Set(varBuscando, false);
                With(
                    {j: ParseJSON(If(IsBlank(varRes), "{}", varRes))},
                    Set(varItem,
                        If(Text(j.encontrado) = "SI",
                            {
                                HRID: Text(j.hrid),
                                copia: Text(j.copia),
                                'Tipo de Material': Text(j.tipo),
                                'Biblioteca-Ubicacion-Colección': Text(j.ubicacion),
                                Título: Text(j.titulo),
                                Autor: Text(j.autor),
                                Idioma: Text(j.idioma),
                                'Fecha registro (ingresado en la base)': Text(j.fecha),
                                'Año de edición': Text(j.anio)
                            }
                        )
                    );
                    Set(varExist,
                        {
                            PA: Coalesce(Value(j.exA), 0),
                            PF: Coalesce(Value(j.exF), 0),
                            Pos: Coalesce(Value(j.exP), 0),
                            Vina: Coalesce(Value(j.exV), 0)
                        }
                    )
                );
                Set(varEncontrado, !IsBlank(varItem));
                ClearCollect(colFicha, tblFichaDescarte);
                Set(varDuplicado, cod in colFicha.'Codigo de Barra');
                If(
                    IsBlank(varRes),
                        Notify("No se pudo consultar FOLIO. Complete la ficha a mano.", NotificationType.Error);
                        SetFocus(txtTitulo_1),
                    varDuplicado,
                        Notify("El código " & cod & " ya está en la ficha.", NotificationType.Warning);
                        Reset(txtEscaneo_1); SetFocus(txtEscaneo_1),
                    !varEncontrado,
                        Notify("El código " & cod & " no está en FOLIO: complete la ficha técnica.", NotificationType.Warning);
                        SetFocus(txtTitulo_1),
                    varRafaga && !IsBlank(drpUnidadDescarte_1.Selected.Value) && !IsBlank(drpJustificacion_1.Selected.Value) && !IsBlank(drpInventario_1.Selected.Value),
                        Select(btnGuardar_1),
                    SetFocus(btnGuardar_1)
                )
            )
        );
        Set(varEntrada, Blank())
      PressedFill: =RGBA(0, 0, 0, 0)
      TabIndex: =-1
      Text: =""
      Width: =1
      X: =0
      Y: =0
